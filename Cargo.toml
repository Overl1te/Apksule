[workspace]
members = [
    "crates/apksule",
    "crates/apksule-apk",
    "crates/apksule-compat",
    "crates/apksule-dex",
    "crates/apksule-runtime",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Overl1te/Apksule"
rust-version = "1.96"

[workspace.dependencies]
apksule-apk = { version = "0.1.0", path = "crates/apksule-apk" }
apksule-compat = { version = "0.1.0", path = "crates/apksule-compat" }
apksule-dex = { version = "0.1.0", path = "crates/apksule-dex" }
apksule-runtime = { version = "0.1.0", path = "crates/apksule-runtime" }
libaxml = "0.0.1"
rfd = "0.17.2"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
softbuffer = "0.4.8"
thiserror = "2.0.19"
tiny-skia = "0.12.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
winit = "0.30.13"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
